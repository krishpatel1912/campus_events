<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register for Event</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; min-height: 100vh; color: #fff;
           display: flex; justify-content: center; align-items: center;
           background: linear-gradient(135deg, #0d0d1a 0%, #1a1040 50%, #0f1b4d 100%); }
    .card { background: rgba(20,20,40,0.92); padding: 36px; border-radius: 14px; width: 400px;
            border: 1px solid #5b3fd1; box-shadow: 0 0 30px rgba(110,70,230,0.45); }
    h2 { text-align: center; margin: 0 0 6px;
         background: linear-gradient(90deg, #a78bfa, #60a5fa);
         -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .info { background: #12122a; border: 1px solid #3b3f78; border-radius: 8px; padding: 12px;
            margin-top: 12px; font-size: 14px; color: #c7cbea; line-height: 1.6; }
    .error { background: #3b1230; color: #ff8aa8; border: 1px solid #a8325a; padding: 10px;
             border-radius: 8px; font-size: 13px; margin: 12px 0 0; text-align: center; }
    label { display: block; margin: 16px 0 6px; font-size: 14px; color: #c7cbea; }
    input { width: 100%; padding: 11px; border-radius: 8px; font-size: 14px; background: #12122a;
            color: #fff; border: 1px solid #3b3f78; outline: none; }
    input:focus { border-color: #8b5cf6; box-shadow: 0 0 8px rgba(139,92,246,0.6); }
    button { width: 100%; margin-top: 22px; padding: 12px; border: none; border-radius: 8px;
             color: #fff; font-size: 16px; font-weight: bold; cursor: pointer;
             background: linear-gradient(90deg, #7c3aed, #2563eb); }
    .back { display: block; text-align: center; margin-top: 14px; color: #8b93b8; font-size: 13px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Register for Event</h2>
    <div class="info">
      <b>{{ event[1] }}</b><br>
      Date: {{ event[2] }}<br>
      Venue: {{ event[3] }}
    </div>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="POST" action="/register/{{ event[0] }}">
      <label>Your Email</label>
      <input type="text" name="email" placeholder="e.g. rahul@univ.edu" value="{{ email }}">
      <button type="submit">Register</button>
    </form>
    <a class="back" href="/student">Back to dashboard</a>
  </div>
</body>
</html>
